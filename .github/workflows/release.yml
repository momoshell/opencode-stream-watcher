name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tag matches package version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            printf 'Tag %s does not match package.json version %s\n' "${GITHUB_REF_NAME}" "${expected_tag}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Set up Node for Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            printf 'Tagged commit %s is not contained in origin/main\n' "${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Publish package
        run: npm publish --ignore-scripts
